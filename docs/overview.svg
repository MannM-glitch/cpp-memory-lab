<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">C++ Memory Lab: follow the address</title>
  <desc id="desc">A pointer p stores address 0x1000 and points to integer x with value 42. Reference r is another name for x. A struct can shrink from 24 to 16 bytes by rearranging aligned members in the illustrated ABI.</desc>
  <rect width="1100" height="390" rx="12" fill="#0b0f16"/>
  <g font-family="system-ui, sans-serif">
    <text x="42" y="45" fill="#c7f479" font-size="13" letter-spacing="3">C++ MEMORY / LAB</text>
    <text x="42" y="96" fill="#e9eef6" font-size="36" font-weight="600">See what your code actually does.</text>
    <text x="42" y="130" fill="#a0aec1" font-size="17">Pointers. References. Memory layout. Compiler transformations.</text>
    <rect x="42" y="174" width="200" height="145" rx="8" fill="#111824" stroke="#81b6ff"/>
    <text x="60" y="203" fill="#81b6ff" font-size="16">p : int*</text>
    <text x="60" y="248" fill="#e9eef6" font-family="monospace" font-size="29">0x1000</text>
    <text x="60" y="292" fill="#a0aec1" font-size="14">stores an address</text>
    <path d="M242 244 H360 L349 238 M360 244 L349 250" stroke="#81b6ff" stroke-width="2" fill="none"/>
    <text x="269" y="224" fill="#a0aec1" font-size="13">points to</text>
    <rect x="365" y="174" width="200" height="145" rx="8" fill="#111824" stroke="#c7f479"/>
    <text x="384" y="203" fill="#c7f479" font-size="16">x : int</text>
    <text x="384" y="248" fill="#e9eef6" font-family="monospace" font-size="32">42</text>
    <text x="384" y="292" fill="#a0aec1" font-size="14">at address 0x1000</text>
    <rect x="449" y="229" width="94" height="29" rx="4" fill="#cfacff"/>
    <text x="461" y="249" fill="#1b1030" font-size="13">r aliases x</text>
    <path d="M618 175 V317" stroke="#2c3747"/>
    <text x="658" y="200" fill="#a0aec1" font-size="14">SAME FIELDS · LESS PADDING</text>
    <text x="658" y="256" fill="#e9eef6" font-size="38">24 B</text>
    <text x="783" y="253" fill="#a0aec1" font-size="28">→</text>
    <text x="840" y="256" fill="#c7f479" font-size="38">16 B</text>
    <text x="658" y="292" fill="#a0aec1" font-size="14">Reorder double → int → char</text>
    <text x="42" y="358" fill="#a0aec1" font-size="13">Interactive experiments + runnable C++20 examples · Addresses and ABI are illustrative.</text>
  </g>
</svg>
